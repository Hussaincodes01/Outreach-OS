name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      # Must match infra/docker/docker-compose.dev.yml: pgvector (the plain
      # postgres image has no `vector` extension) and the `postgres` superuser
      # as the bootstrap role. Bootstrapping as `outreach` would make the app
      # role a SUPERUSER, which implicitly bypasses RLS — every tenancy
      # isolation test would then pass without proving anything.
      postgres:
        image: pgvector/pgvector:0.7.4-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # App connects as the NON-superuser role so RLS is enforced under test.
      DATABASE_URL: postgresql+asyncpg://outreach:outreach@localhost:5432/outreach_test
      DATABASE_URL_SYNC: postgresql://outreach:outreach@localhost:5432/outreach_test
      TEST_DATABASE_URL: postgresql+asyncpg://outreach:outreach@localhost:5432/outreach_test
      # Migrations run as the superuser (migration 0010 does ALTER FUNCTION
      # ... OWNER), matching the `migrate` service in the root docker-compose.yml.
      DATABASE_URL_ADMIN: postgresql+asyncpg://postgres:postgres@localhost:5432/outreach_test
      REDIS_URL: redis://localhost:6379/0
      # conftest defaults these to the dev-infra Redis on :6380; CI's Redis
      # service is on :6379.
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      VAULT_MASTER_KEY: 2QU3n0T0Q3n0T0Q3n0T0Q3n0T0Q3n0T0Q3n0T0Q3n0Q=
      LOG_LEVEL: WARNING
      ENVIRONMENT: ci
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: outreach
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Reuse the same bootstrap SQL the dev/prod containers run via
      # /docker-entrypoint-initdb.d, so CI, local and production agree on the
      # role and grant topology instead of drifting.
      - name: Bootstrap database (roles, databases, extensions, grants)
        working-directory: .
        run: |
          for f in infra/docker/postgres/initdb/*.sql; do
            echo "--- $f"
            PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f "$f"
          done

      # The draft pipeline stores rendered bodies in object storage, so the
      # tests need an S3-compatible endpoint. MinIO needs `server /data` args,
      # which `services:` cannot express — run it as a step instead.
      - name: Start MinIO (S3-compatible object storage)
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 2
          done
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy src
      - name: Test
        run: pytest -q --maxfail=1

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # npm workspaces: there is a single lockfile at the repo root and
          # dependencies are hoisted there. apps/web has no lockfile of its own.
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  compose:
    name: Compose (config validity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml reads secrets via env_file: [.env], so `config`
      # needs a .env to resolve against. Any file with the required keys
      # works here — this only validates the compose file parses and
      # interpolates, it does not start the stack.
      - name: Create placeholder .env
        run: cp .env.example .env
      - name: Validate docker-compose.yml
        run: docker compose config -q
