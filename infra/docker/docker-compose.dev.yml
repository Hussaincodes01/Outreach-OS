services:
  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    container_name: outreach-postgres
    restart: unless-stopped
    environment:
      # We use the default `postgres` superuser as the bootstrap role
      # so the initdb scripts can create a *non-superuser* `outreach`
      # role for the application. Superusers bypass RLS by design,
      # which would defeat the Phase 0 multi-tenant safety net.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d outreach"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: outreach-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Docker Hub no longer serves minio/minio or minio/mc for anonymous pulls
    # ("repository does not exist"); MinIO now publishes those images only to
    # quay.io. Pinned to the same verified release tag as the root
    # docker-compose.yml.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: outreach-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    # Pinned to a release tag verified with `docker pull`.
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: outreach-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/outreach &&
      mc anonymous set download local/outreach || true
      "

  greenmail:
    image: greenmail/standalone:2.1.2
    container_name: outreach-greenmail
    restart: unless-stopped
    environment:
      # Accept any login; mailboxes are created on first delivery. Test-only server.
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.auth.disabled -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.verbose"
    ports:
      - "3025:3025"
      - "3143:3143"

volumes:
  postgres-data:
  redis-data:
  minio-data:
