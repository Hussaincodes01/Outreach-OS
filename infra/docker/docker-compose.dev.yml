services:
  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    container_name: outreach-postgres
    restart: unless-stopped
    environment:
      # We use the default `postgres` superuser as the bootstrap role
      # so the initdb scripts can create a *non-superuser* `outreach`
      # role for the application. Superusers bypass RLS by design,
      # which would defeat the Phase 0 multi-tenant safety net.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d outreach"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: outreach-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    # RustFS: S3-compatible object storage (MinIO's community images are no
    # longer pullable anonymously). Listens for S3 on 9000, console on 9001.
    # The app creates missing buckets itself (core.s3.ensure_bucket).
    image: rustfs/rustfs:1.0.0
    container_name: outreach-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  greenmail:
    image: greenmail/standalone:2.1.2
    container_name: outreach-greenmail
    restart: unless-stopped
    environment:
      # Accept any login; mailboxes are created on first delivery. Test-only server.
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.auth.disabled -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.verbose"
    ports:
      - "3025:3025"
      - "3143:3143"

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
