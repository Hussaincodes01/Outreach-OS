# Production-ish, self-contained stack.
#
#   Build context MUST be the repo root. Run from the repo root:
#     docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production up -d --build
#
# This bundles Postgres + Redis so the stack is runnable out of the box. For a
# hardened production deploy, point DATABASE_URL / REDIS_URL at managed
# services and remove the `postgres` / `redis` services below.
#
# Application secrets (JWT_SECRET, VAULT_MASTER_KEY, INBOUND_WEBHOOK_SECRET,
# CORS_ALLOWED_ORIGINS, PUBLIC_BASE_URL, ...) are read from .env.production via
# `env_file`. Only host-specific URLs are overridden per service below.
#
# Internal DB credentials (outreach/outreach, postgres superuser) are fixed by
# infra/docker/postgres/initdb and are container-internal only. Harden them
# (or use a managed DB) for real production.

name: outreach-os-prod

x-api-build: &api-build
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile.api
  image: outreach-os-api:latest

# Shared runtime env for every service that imports the app config.
x-app-env: &app-env
  env_file:
    - ../../.env.production

x-runtime-urls: &runtime-urls
  # App connects as the NON-superuser role so RLS is enforced.
  DATABASE_URL: postgresql+asyncpg://outreach:outreach@postgres:5432/outreach
  DATABASE_URL_SYNC: postgresql://outreach:outreach@postgres:5432/outreach
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the non-superuser `outreach` role, the app databases, and the
      # pgcrypto/vector extensions inside them (00/01/02 init scripts).
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: apply Alembic migrations as the SUPERUSER. Migration 0010 runs
  # `ALTER FUNCTION auth_user_by_email(text) OWNER TO postgres`, which requires
  # superuser — the runtime app role (outreach) cannot do it, and without it
  # login silently returns nothing under RLS. The runtime services still
  # connect as the non-superuser role (see DATABASE_URL above).
  migrate:
    <<: [*api-build, *app-env]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Superuser URL — migrations only.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/outreach
    command: ["alembic", "upgrade", "head"]

  api:
    <<: [*api-build, *app-env]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *runtime-urls
      GUNICORN_WORKERS: "4"
    ports:
      - "8000:8000"

  worker:
    # Reuse the API image; just run the Celery worker instead of the web server.
    <<: [*api-build, *app-env]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *runtime-urls
    command:
      ["celery", "-A", "outreach_os.workers.celery_app", "worker", "-l", "info", "--concurrency", "4"]

  beat:
    # Periodic task scheduler (email digest, etc.). Exactly one beat instance.
    <<: [*api-build, *app-env]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *runtime-urls
    command:
      ["celery", "-A", "outreach_os.workers.celery_app", "beat", "-l", "info"]

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Baked into the client bundle at build time. Set to the PUBLIC API URL
        # the browser will reach (e.g. https://api.example.com).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: outreach-os-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
