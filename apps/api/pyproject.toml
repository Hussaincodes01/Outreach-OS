[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "outreach-os-api"
version = "0.1.0"
description = "Outreach OS backend — FastAPI multi-tenant SaaS for AI cold outreach."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Outreach OS contributors" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "sqlalchemy[asyncio]>=2.0.25,<3.0",
    "asyncpg>=0.29,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "email-validator>=2.1,<3.0",
    "dnspython>=2.4,<3.0",
    "celery[redis]>=5.3,<6.0",
    "redis>=5.0,<6.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt==4.0.1",
    "cryptography>=41.0,<43.0",
    "httpx>=0.26,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "structlog>=24.1,<25.0",
    "sentry-sdk[fastapi]>=1.40,<2.0",
    "litellm>=1.30,<2.0",
    "scrapling[fetchers]>=0.2,<1.0",
    "tenacity>=8.2,<9.0",
    "boto3>=1.34,<2.0",
    "tiktoken>=0.7,<1.0",
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    "pgvector>=0.3,<1.0",
]

[project.optional-dependencies]
prod = [
    # Production process manager. Runs the ASGI app via uvicorn workers
    # (see infra/docker/Dockerfile.api CMD).
    "gunicorn>=21.2,<23.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=4.1,<5.0",
    "freezegun>=1.4,<2.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.8,<2.0",
    "types-passlib>=1.7.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/outreach_os"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live_llm: marks tests that hit a real LLM provider (skipped if no API key)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit (security)
    "C4",  # flake8-comprehensions
    "RET",
    "SIM",
    "TID",
    "PT",
    "RUF",
]
ignore = [
    "S101",  # use of assert — fine in tests
    "S105",  # hardcoded password — fine in dev seed
    "S106",  # hardcoded password — fine in dev seed
    "B008",  # function call in default argument — FastAPI Depends pattern
    "E501",  # line length — covered by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]
"alembic/*" = ["E", "F", "W", "I", "N", "UP"]
# flake8-pytest-style only makes sense in the test suite. In src it misfires on
# any endpoint whose name starts with `test_` (e.g. POST /credentials/{id}/test).
"src/*" = ["PT"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
